name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: npm test (full output on failure)
        run: |
          npm test 2>&1 | tail -80
          test "${PIPESTATUS[0]}" -eq 0
      - name: smoke fails cleanly without a key
        run: node scripts/smoke.js && exit 1 || test $? -eq 1
